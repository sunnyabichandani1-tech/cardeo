<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardeo</title>
<meta name="description" content="Cardeo: plan your day in cards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --board-bg:linear-gradient(135deg,#6f5bd3 0%,#9b6cc4 55%,#d27ab8 100%);
  --list:#f1f2f4; --card:#ffffff; --text:#172b4d; --muted:#626f86; --faint:#8590a2;
  --border:#dcdfe4; --hover:#e9ebee; --btn:#091e420f; --btn-hover:#091e4224;
  --accent:#0c66e4; --accent-text:#ffffff; --accent-soft:#e9f2ff;
  --danger:#c9372c; --ok:#1f845a; --ok-soft:#dcfff1; --warn:#f5cd47;
  --overlay:rgba(9,30,66,.62); --panel:#ffffff; --shadow:0 8px 24px rgba(9,30,66,.2), 0 0 1px rgba(9,30,66,.3);
  --card-shadow:0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31);
  --code:#f1f2f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --list:#101204; --card:#22272b; --text:#b6c2cf; --muted:#9fadbc; --faint:#738496;
    --border:#38414a; --hover:#2c333a; --btn:#a1bdd914; --btn-hover:#a6c5e229;
    --accent:#579dff; --accent-text:#1d2125; --accent-soft:#1c2b41;
    --danger:#f87168; --ok:#4bce97; --ok-soft:#164b35; --overlay:rgba(0,0,0,.7); --panel:#282e33;
    --shadow:0 8px 24px rgba(0,0,0,.5), 0 0 1px rgba(255,255,255,.1); --card-shadow:0 1px 1px rgba(0,0,0,.5); --code:#1d2125;
  }
}
:root[data-theme="dark"]{
  --list:#101204; --card:#22272b; --text:#b6c2cf; --muted:#9fadbc; --faint:#738496;
  --border:#38414a; --hover:#2c333a; --btn:#a1bdd914; --btn-hover:#a6c5e229;
  --accent:#579dff; --accent-text:#1d2125; --accent-soft:#1c2b41;
  --danger:#f87168; --ok:#4bce97; --ok-soft:#164b35; --overlay:rgba(0,0,0,.7); --panel:#282e33;
  --shadow:0 8px 24px rgba(0,0,0,.5), 0 0 1px rgba(255,255,255,.1); --card-shadow:0 1px 1px rgba(0,0,0,.5); --code:#1d2125;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--board-bg);background-attachment:fixed;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:"Figtree",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.43;color:var(--text);display:flex;flex-direction:column;overflow:hidden;background:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
svg.i.lg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
#topbar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(0,0,0,.32);color:#fff;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand-mark{width:24px;height:24px;border-radius:6px;background:#fff;display:grid;place-items:center}
.brand-mark span{display:block;width:4px;background:#0c66e4;border-radius:1px;margin:0 1px}
.search-wrap{position:relative;flex:1;max-width:620px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.search-box:focus-within{background:#fff;color:#172b4d}
.search-box input{flex:1;min-width:0;border:0;background:none;outline:none;color:inherit}
.search-box input::placeholder{color:rgba(255,255,255,.85)}
.search-box:focus-within input::placeholder{color:#626f86}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
#searchResults{position:absolute;top:40px;left:0;right:0;background:var(--panel);color:var(--text);border-radius:8px;box-shadow:var(--shadow);max-height:min(70vh,520px);overflow:auto;z-index:60;padding:6px}
.sr-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px}
.sr-item:hover,.sr-item.on{background:var(--hover)}
.sr-title{font-weight:600}
.sr-sub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sr-empty{padding:14px;color:var(--muted);text-align:center}
mark{background:#f8e6a0;color:#172b4d;border-radius:2px;padding:0 1px}
.tag{font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--btn);color:var(--muted)}
.tag.arch{background:#fff7d6;color:#7f5f01}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;position:relative}
#topbar .icon-btn:hover,#boardbar .icon-btn:hover{background:rgba(255,255,255,.2)}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:#e2483d;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#sync{font-size:12px;opacity:.85;white-space:nowrap}

/* ---------- board header ---------- */
#boardbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.18);color:#fff}
.board-name{font-size:18px;font-weight:700;padding:4px 10px;border-radius:6px;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-name:hover{background:rgba(255,255,255,.2)}
.board-name-input{font-size:18px;font-weight:700;padding:3px 9px;border-radius:6px;border:2px solid var(--accent);background:#fff;color:#172b4d;width:min(360px,60vw)}
.views-btn{display:flex;align-items:center;gap:2px;height:32px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.85);color:#172b4d}
.views-btn:hover{background:#fff}
.spacer{flex:1}
.head-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;background:rgba(255,255,255,.2);font-weight:600}
.head-btn:hover{background:rgba(255,255,255,.3)}

/* ---------- canvas ---------- */
#canvas{flex:1;min-height:0;display:flex;align-items:stretch}
.pinned-zone{flex:none;display:flex;align-items:flex-start;gap:12px;padding:12px 0 88px 12px;overflow-y:hidden;position:relative}
.pinned-zone.has{padding-right:12px;border-right:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.08)}
.pinned-zone:not(.has){padding:0}
.scroll-zone{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 12px 88px;overflow-x:auto;overflow-y:hidden}
.list{flex:none;width:272px;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:12px;box-shadow:var(--card-shadow);color:var(--text)}
.list-head{display:flex;align-items:center;gap:2px;padding:8px 8px 4px 12px;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.list-title{flex:1;min-width:0;font-size:14px;font-weight:600;margin:0;padding:4px 4px;border-radius:4px;overflow-wrap:anywhere;cursor:pointer}
.list-title-input{flex:1;min-width:0;font-weight:600;padding:3px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--card)}
.list-count{font-size:14px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.list-flag{color:var(--muted);display:grid;place-items:center;width:22px}
.l-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.l-btn:hover{background:var(--btn-hover);color:var(--text)}
.list-cards{flex:0 1 auto;min-height:4px;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:8px}
.list-foot{display:flex;align-items:center;gap:4px;padding:4px 8px 8px}
.add-card-btn{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;color:var(--muted);font-weight:500}
.add-card-btn:hover,.add-top-btn:hover{background:var(--btn-hover);color:var(--text)}
.add-top-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.list.collapsed{width:44px;align-items:center;padding:8px 0;cursor:pointer;gap:10px}
.list.collapsed .v-title{writing-mode:vertical-rl;font-weight:600;white-space:nowrap}
.list.collapsed .list-count{padding:0}
.add-list{flex:none;width:272px;border-radius:12px;background:rgba(255,255,255,.24);color:#fff}
.add-list:hover{background:rgba(255,255,255,.34)}
.add-list>button{display:flex;align-items:center;gap:8px;width:100%;padding:12px;font-weight:600}
.add-list-form{background:var(--list);color:var(--text);padding:8px;border-radius:12px}
.add-list-form input{width:100%;padding:6px 10px;border:2px solid var(--accent);border-radius:6px;background:var(--card)}

/* list colours */
.lc-green{--list:#baf3db}.lc-yellow{--list:#f8e6a0}.lc-orange{--list:#fedec8}.lc-red{--list:#ffd5d2}
.lc-purple{--list:#dfd8fd}.lc-blue{--list:#cce0ff}.lc-sky{--list:#c6edfb}.lc-lime{--list:#d3f1a7}.lc-pink{--list:#fdd0ec}.lc-grey{--list:#dcdfe4}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .lc-green{--list:#164b35}:root:not([data-theme="light"]) .lc-yellow{--list:#533f04}
  :root:not([data-theme="light"]) .lc-orange{--list:#702e00}:root:not([data-theme="light"]) .lc-red{--list:#5d1f1a}
  :root:not([data-theme="light"]) .lc-purple{--list:#352c63}:root:not([data-theme="light"]) .lc-blue{--list:#09326c}
  :root:not([data-theme="light"]) .lc-sky{--list:#164555}:root:not([data-theme="light"]) .lc-lime{--list:#37471f}
  :root:not([data-theme="light"]) .lc-pink{--list:#50253f}:root:not([data-theme="light"]) .lc-grey{--list:#2c333a}
}

/* ---------- cards ---------- */
.card{position:relative;background:var(--card);border-radius:8px;box-shadow:var(--card-shadow);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
.card:hover{outline:2px solid var(--accent)}
.card-body{padding:8px 12px 6px}
.card-cover{height:36px}
.card-cover.img{height:auto;max-height:160px;display:block;width:100%;object-fit:cover}
.card-labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.lbl{display:inline-flex;align-items:center;max-width:100%;min-height:16px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;line-height:16px;color:#172b4d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl.dark{color:#fff}
.card-row{display:flex;align-items:flex-start;gap:0}
.check{flex:none;width:0;height:16px;margin-top:2px;opacity:0;overflow:hidden;border-radius:50%;transition:width .15s ease,opacity .15s ease,margin .15s ease;color:var(--muted);display:grid;place-items:center}
.card:hover .check,.card:focus-within .check,.card.done .check{width:16px;opacity:1;margin-right:6px}
.check .ring{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted)}
.check:hover .ring{border-color:var(--text)}
.check .tick{display:none;width:16px;height:16px;border-radius:50%;background:#22a06b;color:#fff;place-items:center}
.card.done .check .ring{display:none}
.card.done .check .tick{display:grid}
.card-title{flex:1;min-width:0;overflow-wrap:anywhere;padding-right:22px}
.card.done .card-title{color:var(--muted)}
.card-badges{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;color:var(--muted);font-size:12px}
.card-badges:empty{display:none}
.bdg{display:inline-flex;align-items:center;gap:4px;height:22px;border-radius:4px}
.bdg.due{padding:0 4px}
.bdg.due.overdue{background:#c9372c;color:#fff}
.bdg.due.soon{background:#f5cd47;color:#172b4d}
.bdg.due.done{background:#1f845a;color:#fff}
.bdg.cl.full{background:#1f845a;color:#fff;padding:0 4px}
.card-arch{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);opacity:0;box-shadow:var(--card-shadow)}
.card:hover .card-arch,.card:focus-within .card-arch{opacity:1}
.card.done .card-arch{opacity:1}
.card-arch:hover{color:var(--text);background:var(--hover)}
@media (hover:none){.check{width:16px;opacity:1;margin-right:6px}.card-arch{opacity:.9}}
.ph{border-radius:8px;background:rgba(9,30,66,.14);flex:none}
.ph.list-ph{width:272px;border-radius:12px;background:rgba(0,0,0,.22);align-self:stretch;max-height:300px}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(3deg);box-shadow:0 12px 28px rgba(0,0,0,.35);opacity:.96}
body.dragging,body.dragging *{cursor:grabbing !important}
.list.drop-hot{outline:3px solid #fff}

/* composer */
.composer{padding:0 8px 8px}
.composer-card{background:var(--card);border-radius:8px;box-shadow:var(--card-shadow);padding:8px 12px}
.composer textarea{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;min-height:40px}
.smart{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.smart:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;border-radius:6px;font-size:12px;font-weight:600;border:1.5px dashed #9f8fef;background:var(--accent-soft)}
.chip button{width:18px;height:18px;border-radius:4px;display:grid;place-items:center}
.chip button:hover{background:var(--btn-hover)}
.row{display:flex;align-items:center;gap:8px}
.composer .row{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;background:var(--btn);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(.92)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.ghosty{background:transparent}
.btn.ghosty:hover{background:var(--btn-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tip{margin-top:8px;background:var(--btn);border-radius:8px;padding:10px 12px;position:relative}
.tip b{display:block;margin-bottom:2px;padding-right:24px}
span>svg.i{display:block}
button>span:has(>svg.i){display:inline-flex}
.tip .x{position:absolute;top:6px;right:6px}

/* ---------- bottom floating bar ---------- */
#floatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);color:var(--text)}
.fb{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;font-weight:600;max-width:46vw}
.fb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb:hover{background:var(--hover)}
.fb.on{background:var(--accent-soft);color:var(--accent)}
.fb-sep{width:1px;height:24px;background:var(--border)}

/* ---------- popover ---------- */
#pop{position:fixed;z-index:120;width:304px;max-width:calc(100vw - 16px);max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);color:var(--text);border-radius:8px;box-shadow:var(--shadow);padding:12px}
#pop.wide{width:352px}
.pop-head{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;margin:-4px -4px 8px}
.pop-head h3{margin:0;text-align:center;font-size:14px;font-weight:600;color:var(--muted)}
.pop-head .icon-btn:hover{background:var(--btn-hover)}
.pop-sec{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;margin:0 -2px}
.pop-item:hover{background:var(--hover)}
.pop-item[disabled]{opacity:.5;cursor:not-allowed}
.pop-item .t{flex:1}
.pop-item small{display:block;color:var(--muted);font-size:12px}
.pop-item .box{width:36px;height:36px;border:1px solid var(--border);border-radius:6px;display:grid;place-items:center;flex:none}
.pop-div{height:1px;background:var(--border);margin:8px 0}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.inp{width:100%;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text)}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{height:32px;border-radius:4px;position:relative}
.sw.on::after{content:"";position:absolute;inset:-3px;border:2px solid var(--accent);border-radius:6px}
.sw.none{background:var(--btn);font-size:12px;color:var(--muted)}
.bg-sw{height:44px;border-radius:6px;position:relative}
.bg-sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.lbl-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.lbl-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.lbl-row .lbl{flex:1;height:32px;line-height:32px;font-size:14px}
.lbl-row .icon-btn{width:32px;height:32px}
.lbl-row .icon-btn:hover{background:var(--btn-hover)}
.lbl-preview{padding:24px 16px;background:var(--btn);border-radius:6px;margin-bottom:10px}
.lbl-preview .lbl{height:32px;line-height:32px;font-size:14px;width:100%}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head b{font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.cal button{height:34px;border-radius:4px}
.cal button:hover{background:var(--hover)}
.cal button.out{color:var(--faint)}
.cal button.today{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.cal button.in{background:var(--accent-soft)}
.cal button.sel{background:var(--accent);color:var(--accent-text)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick .btn{height:28px;font-size:12px}
.date-row{display:flex;align-items:center;gap:8px}
.date-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.date-row .inp{flex:1;min-width:0}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:80;background:var(--overlay);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:48px 16px 96px}
.dialog{width:min(1040px,100%);background:var(--panel);color:var(--text);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.d-top{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--border)}
.list-pill{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:4px;background:var(--btn);font-weight:600}
.list-pill:hover{background:var(--btn-hover)}
.d-top .icon-btn:hover{background:var(--btn-hover)}
.d-top .icon-btn.on{color:var(--accent)}
.d-cover{height:116px;display:block;width:100%;object-fit:cover}
.d-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.d-main{padding:20px 24px 28px 20px}
.d-side{background:var(--list);padding:20px 20px 28px;border-left:1px solid var(--border)}
.d-title-row{display:flex;align-items:flex-start;gap:12px}
.d-check{margin-top:9px;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.d-check.on{background:#22a06b;border-color:#22a06b;color:#fff}
.d-title{flex:1;font-size:24px;font-weight:700;line-height:1.3;border:0;border-radius:6px;padding:2px 6px;margin-left:-6px;background:transparent;resize:none;overflow:hidden;width:100%}
.d-title:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent);background:var(--card)}
.d-title.done{color:var(--muted)}
.archived-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7d6;color:#533f04;padding:10px 16px}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px 32px}
.d-act{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-weight:500}
.d-act:hover{background:var(--hover)}
.d-act.on{background:#44546f;color:#fff;border-color:#44546f}
.d-meta{display:flex;flex-wrap:wrap;gap:16px 24px;margin:16px 0 0 32px}
.d-meta h4,.sec-h h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.d-meta .lbls{display:flex;flex-wrap:wrap;gap:4px}
.d-meta .lbl{height:32px;line-height:32px;font-size:14px;cursor:pointer}
.sq-btn{width:32px;height:32px;border-radius:4px;background:var(--btn);display:grid;place-items:center}
.sq-btn:hover{background:var(--btn-hover)}
.due-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:4px;background:var(--btn);font-weight:500}
.due-chip:hover{background:var(--btn-hover)}
.due-chip .st{font-size:12px;font-weight:600;padding:0 4px;border-radius:3px}
.st.overdue{background:#c9372c;color:#fff}.st.soon{background:#f5cd47;color:#172b4d}.st.done{background:#1f845a;color:#fff}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sec-h .ic{width:20px;display:grid;place-items:center;color:var(--muted)}
.sec-h h3{flex:1;margin:0;font-size:16px;font-weight:600}
.sec-b{margin-left:32px}
.cf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.desc-view{min-height:40px;padding:8px 12px;border-radius:6px;cursor:text;overflow-wrap:anywhere}
.desc-view.empty{background:var(--btn);color:var(--muted);min-height:56px}
.desc-view.empty:hover{background:var(--btn-hover)}
.rich h1{font-size:22px;margin:.6em 0 .3em}.rich h2{font-size:18px;margin:.6em 0 .3em}.rich h3{font-size:15px;margin:.6em 0 .3em}
.rich p{margin:.35em 0}.rich img{max-width:100%;border-radius:6px;display:block;margin:6px 0}
.rich blockquote{margin:6px 0;padding:2px 12px;border-left:3px solid var(--border);color:var(--muted)}
.rich pre{background:var(--code);padding:10px 12px;border-radius:6px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.rich code{background:var(--code);padding:1px 4px;border-radius:3px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.rich table{border-collapse:collapse;margin:8px 0;min-width:60%}
.rich td,.rich th{border:1px solid var(--border);padding:6px 10px;min-width:60px;vertical-align:top;text-align:left}
.rich th{background:var(--btn);font-weight:600}
.rich a{color:var(--accent)}
.rich hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.rich ul,.rich ol{padding-left:22px;margin:.35em 0}
.tbl-wrap{overflow-x:auto}
.rte{border:2px solid var(--accent);border-radius:6px;background:var(--card)}
.rte-bar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:6px 6px 0 0}
.rb{height:30px;min-width:30px;padding:0 6px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:2px}
.rb:hover,.rb.on{background:var(--btn-hover)}
.rb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.rte-body{min-height:160px;max-height:60vh;overflow:auto;padding:10px 14px;outline:none}
.rte-body:empty::before{content:attr(data-ph);color:var(--faint)}
.tbl-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-top:1px solid var(--border);background:var(--btn)}
.tbl-bar .btn{height:28px;font-size:12px}
.slash{position:fixed;z-index:130;width:240px;max-height:300px;overflow:auto;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:6px}
.slash button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:6px;text-align:left}
.slash button.on,.slash button:hover{background:var(--hover)}
.tbl-pick{display:grid;grid-template-columns:repeat(6,22px);gap:3px}
.tbl-pick span{width:22px;height:22px;border:1px solid var(--border);border-radius:3px}
.tbl-pick span.on{background:var(--accent-soft);border-color:var(--accent)}
.att{display:flex;gap:12px;align-items:center;padding:6px 0}
.att-thumb{width:96px;height:64px;border-radius:6px;background:var(--btn);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none;overflow:hidden}
.att-thumb img{width:100%;height:100%;object-fit:cover}
.att-info{flex:1;min-width:0}
.att-info a{font-weight:600;color:var(--text);text-decoration:none;overflow-wrap:anywhere}
.att-info a:hover{text-decoration:underline}
.att-info .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.linkish{color:var(--muted);text-decoration:underline;font-size:12px}
.linkish:hover{color:var(--text)}
.cl{margin-top:24px}
.cl-prog{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.cl-prog span{width:32px;font-size:12px;color:var(--muted);text-align:right}
.bar{flex:1;height:8px;border-radius:4px;background:var(--btn);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.bar i.full{background:#22a06b}
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:4px 6px;margin-left:-6px;border-radius:6px}
.cl-item:hover{background:var(--hover)}
.cl-item input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:#22a06b;flex:none}
.cl-item .txt{flex:1;cursor:pointer;overflow-wrap:anywhere}
.cl-item.checked .txt{text-decoration:line-through;color:var(--muted)}
.cl-item .icon-btn{width:28px;height:28px;opacity:0}
.cl-item:hover .icon-btn,.cl-item .icon-btn:focus-visible{opacity:1}
@media (hover:none){.cl-item .icon-btn{opacity:1}}
.feed-item{display:flex;gap:10px;margin:14px 0}
.avatar{width:32px;height:32px;border-radius:50%;background:#1d7afc;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.feed-item .who{font-size:14px}
.feed-item .when{font-size:12px;color:var(--muted)}
.comment-box{background:var(--card);border-radius:8px;padding:8px 12px;box-shadow:var(--card-shadow);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-in{width:100%;border:0;border-radius:8px;padding:9px 12px;background:var(--card);box-shadow:var(--card-shadow);resize:none;min-height:40px}
.comment-in:focus{outline:2px solid var(--accent)}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:90;background:var(--panel);color:var(--text);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.dr-head h3{margin:0;text-align:center;font-size:16px}
.dr-head .icon-btn:hover{background:var(--btn-hover)}
.dr-body{flex:1;overflow:auto;padding:12px}
.seg{display:flex;background:var(--btn);border-radius:8px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:30px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--card-shadow)}
.arch-item{background:var(--list);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.arch-item .t{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.arch-item .t:hover{text-decoration:underline}
.arch-item .s{font-size:12px;color:var(--muted);margin:2px 0 8px}
.notif{display:flex;gap:10px;padding:10px;border-radius:8px;cursor:pointer}
.notif:hover{background:var(--hover)}
.notif.unread{background:var(--accent-soft)}
.notif .when{font-size:12px;color:var(--muted)}
.empty-note{color:var(--muted);text-align:center;padding:24px 8px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#172b4d;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:90vw}
.toast button{color:#85b8ff;font-weight:600}

/* colourblind patterns */
body.cb .lbl.p1{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.2) 0 2px,transparent 2px 7px)}
body.cb .lbl.p2{background-image:radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.5px);background-size:6px 6px}
body.cb .lbl.p3{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 6px)}
body.cb .lbl.p4{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 6px)}

@media (max-width:760px){
  .d-grid{grid-template-columns:1fr}
  .d-side{border-left:0;border-top:1px solid var(--border)}
  #modal{padding:0}
  .dialog{border-radius:0;min-height:100%}
  .d-main{padding:16px}
  .d-actions,.d-meta,.sec-b{margin-left:0}
  .brand b{display:none}
  #sync{display:none}
  .scroll-zone{scroll-snap-type:x mandatory;scroll-padding:12px}
  .scroll-zone>.list{scroll-snap-align:start}
  .list,.add-list{width:min(300px,84vw)}
  .kbd{display:none}
}
.hide-sm{}
@media (max-width:760px){.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

const CACHE_KEY = "activity-tracker-v1";
function loadCache() { try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }

const Store = {
  mode: "local", uid: null, refs: null, assets: null,
  dirty: new Map(), inflight: new Set(), timer: null,
  mark(key, op = "set") { this.dirty.set(key, op); this.schedule(); },
  schedule() {
    saveCacheSoon();
    clearTimeout(this.timer);
    if (this.mode === "remote") { setSync("Saving"); this.timer = setTimeout(() => this.flush(), 450); }
    else { this.dirty.clear(); setSync(); }
  },
  pending(key) { return this.dirty.has(key) || this.inflight.has(key); },
  async flush() {
    if (this.mode !== "remote") return;
    const entries = [...this.dirty];
    this.dirty.clear();
    await Promise.all(entries.map(([k, op]) => this.writeOne(k, op)));
    if (!this.dirty.size && !this.inflight.size) setSync();
  },
  refFor(k) {
    if (k === "meta") return this.refs.meta;
    const [t, id] = k.split(":");
    return t === "b" ? this.refs.boards.doc(id) : this.refs.cards.doc(id);
  },
  dataFor(k) {
    if (k === "meta") return clone(S.meta);
    const [t, id] = k.split(":");
    const o = t === "b" ? S.boards[id] : S.cards[id];
    return o ? clone(o) : null;
  },
  async writeOne(k, op) {
    if (this.inflight.has(k)) { this.dirty.set(k, op); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 450); return; }
    this.inflight.add(k);
    try {
      const ref = this.refFor(k);
      const data = op === "del" ? null : this.dataFor(k);
      if (data) await ref.set(data); else await ref.delete();
    } catch (e) {
      const code = e && e.code;
      if (code === "unavailable") { await sleep(700 + Math.random() * 900); this.dirty.set(k, op); }
      else if (code === "invalid_argument" && k.startsWith("c:")) toast("This card is too big to save. Remove some pasted images and use Attachment instead.");
      else if (code === "quota_exceeded") toast("Storage is full. Delete some archived cards to free space.");
      else if (code === "revoked") { this.mode = "local"; setSync(); }
    } finally {
      this.inflight.delete(k);
      if (this.dirty.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 450); }
      else if (!this.inflight.size) setSync();
    }
  }
};
function setSync(state) {
  const el = $("#sync"); if (!el) return;
  if (Store.mode === "remote") el.textContent = state === "Saving" ? "Saving…" : "All changes saved";
  else el.textContent = Store.connecting ? "Connecting…" : "Saved in this browser";
}
const saveCard = c => { c.updatedAt = now(); Store.mark("c:" + c.id); };
const saveBoard = b => Store.mark("b:" + b.id);
const saveMeta = () => Store.mark("meta");
function deleteCardDoc(id) { delete S.cards[id]; Store.mark("c:" + id, "del"); }

async function initRemote() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  Store.connecting = true; setSync();
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
  let id = null;
  if (db && user) { try { id = await user.id(); } catch {} }
  if (!db || !id) { Store.connecting = false; setSync(); return; }
  try { Store.assets = await window.claude.use("assets"); } catch { Store.assets = null; }
  const meta = db.doc("data/users/" + id + "/meta");
  Store.refs = {meta, boards: meta.collection("boards"), cards: meta.collection("cards")};
  const tmp = {meta: undefined, boards: null, cards: null};
  const got = {meta: false, boards: false, cards: false};
  let started = false;
  const start = () => {
    if (started || !got.meta || !got.boards || !got.cards) return;
    started = true; Store.connecting = false; Store.mode = "remote";
    if (!tmp.meta) {
      // first time online: move what is in this browser (or a fresh board) to the online store
      ensureValid();
      Store.mark("meta");
      for (const bid of Object.keys(S.boards)) Store.mark("b:" + bid);
      for (const cid of Object.keys(S.cards)) Store.mark("c:" + cid);
    } else {
      S = {meta: tmp.meta, boards: tmp.boards || {}, cards: tmp.cards || {}};
      ensureValid();
      saveCache();
    }
    setSync();
    renderAll();
  };
  const onErr = () => {};
  meta.onSnapshot(snap => {
    const d = snap.exists ? clone(snap.data()) : null;
    if (!started) { tmp.meta = d; if (!snap.metadata.fromCache) { got.meta = true; start(); } return; }
    if (Store.pending("meta") || !d) return;
    if (stable(d) === stable(S.meta)) return;
    S.meta = d; ensureValid(); remoteChanged();
  }, onErr);
  const colSub = (col, key, prefix) => col.onSnapshot(snap => {
    if (!started) {
      tmp[key] = Object.fromEntries(snap.docs.map(d => [d.id, clone(d.data())]));
      if (!snap.metadata.fromCache) { got[key] = true; start(); }
      return;
    }
    let changed = false;
    for (const ch of snap.docChanges()) {
      const did = ch.doc.id;
      if (Store.pending(prefix + did)) continue;
      if (ch.type === "removed") { if (S[key][did]) { delete S[key][did]; changed = true; } continue; }
      const d = clone(ch.doc.data());
      if (stable(d) === stable(S[key][did])) continue;
      S[key][did] = d; changed = true;
    }
    if (changed) { ensureValid(); remoteChanged(); }
  }, onErr);
  colSub(Store.refs.boards, "boards", "b:");
  colSub(Store.refs.cards, "cards", "c:");
}
let remoteRaf = 0;
function remoteChanged() {
  saveCacheSoon();
  cancelAnimationFrame(remoteRaf);
  remoteRaf = requestAnimationFrame(() => {
    renderChrome(); renderBoard();
    const m = $("#modal");
    if (m && UI.openCardId && !m.contains(document.activeElement) && !$("#pop") && !UI.descEditing) renderModal();
    if (UI.drawer) renderDrawer();
  });
}

/* ================= dates ================= */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
function parseLocal(s) { // "YYYY-MM-DD" or "YYYY-MM-DDTHH:mm"
  if (!s) return null;
  const [dp, tp] = s.split("T");
  const [y, m, d] = dp.split("-").map(Number);
  const [H, M] = (tp || "00:00").split(":").map(Number);
  return new Date(y, m - 1, d, H, M);
}
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
function fmtShort(d, withYear) { const s = d.getDate() + " " + MONTHS[d.getMonth()]; return withYear || d.getFullYear() !== new Date().getFullYear() ? s + " " + d.getFullYear() : s; }
function fmtTime(d) { let H = d.getHours(), M = d.getMinutes(); const ap = H >= 12 ? "pm" : "am"; H = H % 12 || 12; return H + (M ? ":" + pad(M) : "") + " " + ap; }
function fmtDue(s, long) {
  const d = parseLocal(s); if (!d) return "";
  const t = hm(d) === DEFAULT_TIME ? "" : ", " + fmtTime(d);
  const today = startOfDay(new Date());
  let day = fmtShort(d);
  if (long) { if (sameDay(d, today)) day = "Today"; else if (sameDay(d, addDays(today, 1))) day = "Tomorrow"; else day = DOW[d.getDay()] + ", " + fmtShort(d); }
  return day + t;
}
function dueStatus(c) {
  if (!c.due) return "";
  if (c.complete) return "done";
  const d = parseLocal(c.due).getTime(), t = now();
  if (t > d) return "overdue";
  if (d - t < 864e5) return "soon";
  return "";
}
function timeAgo(ts) {
  const s = Math.round((now() - ts) / 1000);
  if (s < 45) return "just now";
  const m = Math.round(s / 60); if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
  const hr = Math.round(m / 60); if (hr < 24) return hr + (hr === 1 ? " hour ago" : " hours ago");
  const d = new Date(ts); return fmtShort(d) + " at " + fmtTime(d);
}

/* smart date reading from a card title */
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const WD_SHORT = {sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6};
const MON_MAP = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
const MON_RE = "(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
const NUMW = {a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10};
function monIdx(s) { return MON_MAP[s.toLowerCase().slice(0, 3)] ?? MON_MAP[s.toLowerCase().slice(0, 4)]; }
function nextWeekday(from, wd, forceNext) {
  let diff = (wd - from.getDay() + 7) % 7;
  if (diff === 0) diff = 7;
  let d = addDays(from, diff);
  if (forceNext) { // "next friday" = the one in next week
    const mondayNext = addDays(startOfDay(from), ((8 - from.getDay()) % 7) || 7);
    while (d < mondayNext) d = addDays(d, 7);
  }
  return d;
}
function futureYear(y, m, d, today) { let dt = new Date(y ?? today.getFullYear(), m, d); if (y == null && dt < today) dt = new Date(today.getFullYear() + 1, m, d); return dt; }
function smartParse(text) {
  const today = startOfDay(new Date());
  const rules = [
    [/\bday after tomorrow\b/i, () => addDays(today, 2)],
    [/\b(today|tonight|tod)\b/i, m => { const d = new Date(today); if (/tonight/i.test(m[1])) d.setHours(20, 0); return d; }],
    [/\b(tomorrow|tmrw|tmr)\b/i, () => addDays(today, 1)],
    [/\bnext week\b/i, () => nextWeekday(today, 1)],
    [/\b(?:this )?weekend\b/i, () => today.getDay() === 6 ? today : nextWeekday(today, 6)],
    [/\bend of (?:the )?week\b/i, () => today.getDay() === 5 ? today : nextWeekday(today, 5)],
    [/\bend of (?:the )?month\b/i, () => new Date(today.getFullYear(), today.getMonth() + 1, 0)],
    [/\bin (\d{1,3}|a|an|one|two|three|four|five|six|seven|eight|nine|ten) (days?|weeks?|months?)\b/i, m => {
      const n = NUMW[m[1].toLowerCase()] ?? Number(m[1]); const u = m[2].toLowerCase();
      if (u.startsWith("day")) return addDays(today, n);
      if (u.startsWith("week")) return addDays(today, 7 * n);
      const d = new Date(today); d.setMonth(d.getMonth() + n); return d; }],
    [new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+of)?\\s+" + MON_RE + "(?:,?\\s+(\\d{4}))?\\b", "i"), m => futureYear(m[3] ? +m[3] : null, monIdx(m[2]), +m[1], today)],
    [new RegExp("\\b" + MON_RE + "\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b", "i"), m => futureYear(m[3] ? +m[3] : null, monIdx(m[1]), +m[2], today)],
    [/\b(next|this|on|by|coming)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)\b/i, m => {
      const w = m[2].toLowerCase(); const wd = WEEKDAYS.indexOf(w) >= 0 ? WEEKDAYS.indexOf(w) : WD_SHORT[w];
      if (m[1].toLowerCase() === "this" && today.getDay() === wd) return today;
      return nextWeekday(today, wd); }],
    [/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i, m => nextWeekday(today, WEEKDAYS.indexOf(m[1].toLowerCase()))],
    [/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/, m => { let y = m[3] ? +m[3] : null; if (y != null && y < 100) y += 2000; return futureYear(y, +m[2] - 1, +m[1], today); }]
  ];
  let best = null;
  for (const [re, fn] of rules) {
    const m = re.exec(text);
    if (m && (!best || m.index < best.index)) {
      const d = fn(m);
      if (d && !isNaN(d)) best = {index: m.index, text: m[0], date: d};
    }
  }
  const tm = /\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b|\bat\s+(\d{1,2}):(\d{2})\b/i.exec(text);
  let time = null;
  if (tm) {
    let H, M;
    if (tm[3]) { H = +tm[1] % 12 + (tm[3].toLowerCase() === "pm" ? 12 : 0); M = +(tm[2] || 0); }
    else { H = +tm[4]; M = +tm[5]; }
    if (H < 24 && M < 60) time = pad(H) + ":" + pad(M);
  }
  if (!best && !time) return null;
  let date = best ? best.date : new Date(today);
  if (!best && time) { const [H, M] = time.split(":").map(Number); const t = new Date(today); t.setHours(H, M); if (t < new Date()) date = addDays(today, 1); }
  const timeStr = time || (best && best.date.getHours() ? hm(best.date) : DEFAULT_TIME);
  return {due: ymd(date) + "T" + timeStr, key: (best ? best.text : "") + "|" + (tm ? tm[0] : "")};
}
function smartLabels(text, b) {
  const found = [];
  const re = /#([\p{L}\p{N}_-]+)/gu; let m;
  while ((m = re.exec(text))) {
    const key = m[1].toLowerCase();
    const l = b.labels.find(x => x.name && x.name.toLowerCase().replace(/\s+/g, "") === key.replace(/[-_]/g, "") || x.name.toLowerCase().replace(/\s+/g, "-") === key);
    if (l && !found.find(f => f.label.id === l.id)) found.push({label: l, token: m[0]});
  }
  return found;
}

/* ================= activity, notifications ================= */
function act(c, text) { c.activity = c.activity || []; c.activity.unshift({text, at: now()}); if (c.activity.length > 60) c.activity.length = 60; }
function listName(c) { const b = S.boards[c.boardId]; return findList(b, c.listId)?.title || "a list"; }
function isWatched(c) { const b = S.boards[c.boardId]; return !!(c.watched || findList(b, c.listId)?.watched); }
function notify(c, text, force) {
  if (!force && !isWatched(c)) return;
  S.meta.notifications.unshift({id: uid(), cardId: c.id, boardId: c.boardId, text, at: now(), read: false});
  if (S.meta.notifications.length > 60) S.meta.notifications.length = 60;
  saveMeta(); renderChrome();
}
function desktopAlert(title, body) {
  try { if ("Notification" in window && Notification.permission === "granted") new Notification(title, {body}); } catch {}
}
function checkReminders() {
  if (!S) return;
  const t = now();
  for (const c of Object.values(S.cards)) {
    if (c.archived || c.complete || !c.due) continue;
    const due = parseLocal(c.due).getTime();
    if (c.reminder && c.reminder !== "none") {
      const key = c.due + "|" + c.reminder;
      const fire = due - Number(c.reminder) * 60000;
      if (t >= fire && t < due + 864e5 && c.reminderSent !== key) {
        c.reminderSent = key; saveCard(c);
        const txt = t >= due ? "is due now" : "is due " + fmtDue(c.due, true).toLowerCase().replace(/^([a-z]{3}),/, "on $1,");
        notify(c, "Reminder: “" + c.title + "” " + txt, true);
        toast("Reminder: " + c.title + " " + txt, {label: "Open", fn: () => openCard(c.id)});
        desktopAlert("Cardeo reminder", c.title + " " + txt);
      }
    }
    if (t > due && c.overdueSent !== c.due && isWatched(c)) {
      c.overdueSent = c.due; saveCard(c);
      notify(c, "“" + c.title + "” is overdue");
    }
  }
}

function readDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function compressImage(file, max = 1100, q = 0.72) {

        const n = Object.values(S.cards).filter(c => c.listId === l.id && !c.archived).length;
        const del = h("button", {class: "btn"}, "Delete");
        del.onclick = () => Pop.open(del, "Delete list?", bb => bb.append(h("p", {style: {margin: "0 0 12px", color: "var(--muted)"}}, "The list and its " + n + " cards will be deleted for good."), h("button", {class: "btn danger block", onclick: () => { Pop.close(); for (const c of Object.values(S.cards)) if (c.listId === l.id) deleteCardDoc(c.id); b.lists = b.lists.filter(x => x.id !== l.id); saveBoard(b); renderDrawer(); }}, "Delete list")));
        body.append(h("div", {class: "arch-item"}, h("div", {class: "t"}, l.title), h("div", {class: "s"}, n + (n === 1 ? " card" : " cards") + ", archived " + timeAgo(l.archivedAt || now())),
          h("div", {class: "row"}, h("button", {class: "btn primary", onclick: () => { l.archived = false; l.pos = Math.max(0, ...activeLists(b).map(x => x.pos)) + 1024; saveBoard(b); renderBoard(); renderDrawer(); toast("List sent back to the board"); }}, h("span", {html: icon("restore", "sm")}), "Send to board"), del)));
      }
    }
  } else {
    const ns = S.meta.notifications;
    const top = h("div", {class: "row", style: {justifyContent: "space-between", marginBottom: "8px", flexWrap: "wrap"}});
    if (ns.some(n => !n.read)) top.append(h("button", {class: "btn", onclick: () => { ns.forEach(n => n.read = true); saveMeta(); renderChrome(); renderDrawer(); }}, "Mark all as read"));
    if ("Notification" in window && Notification.permission === "default") top.append(h("button", {class: "btn", onclick: async () => { try { await Notification.requestPermission(); } catch {} renderDrawer(); }}, "Turn on desktop alerts"));
    if (ns.length) top.append(h("button", {class: "btn ghosty", onclick: () => { S.meta.notifications = []; saveMeta(); renderChrome(); renderDrawer(); }}, "Clear all"));
    body.append(top);
    body.append(h("p", {style: {fontSize: "12px", color: "var(--muted)", margin: "0 0 8px"}}, "You get alerts here for reminders you set, and for anything that happens in lists or cards you watch."));
    if (!ns.length) body.append(h("div", {class: "empty-note"}, "No notifications yet. Cardeo will alert you here. Open a list menu and choose Watch list, or set a reminder in Dates."));
    for (const n of ns) {
      const c = S.cards[n.cardId];
      body.append(h("div", {class: "notif" + (n.read ? "" : " unread"), role: "button", tabindex: 0, onclick: () => { n.read = true; saveMeta(); renderChrome(); if (c) { closeDrawer(); openCard(c.id); } else renderDrawer(); }},
        h("span", {html: icon(n.text.startsWith("Reminder") ? "clock" : "eye")}),
        h("div", {}, h("div", {}, n.text), h("div", {class: "when"}, (S.boards[n.boardId]?.name || "") + ", " + timeAgo(n.at)))));
    }
  }
}

/* ================= search ================= */
const Search = {idx: 0, results: []};
function runSearch() {
  const inp = $("#searchInput"), box = $("#searchResults");
  const q = inp.value.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const terms = q.split(/\s+/);
  const res = [];
  for (const c of Object.values(S.cards)) {
    const b = S.boards[c.boardId]; if (!b) continue;
    const labels = c.labels.map(id => b.labels.find(l => l.id === id)?.name || "").join(" ");
    const hay = [c.title, htmlText(c.description), c.checklists.flatMap(x => [x.title, ...x.items.map(i => i.text)]).join(" "), c.comments.map(x => x.text).join(" "), labels, c.location?.address || "", Object.values(c.custom || {}).join(" ")].join(" \n ").toLowerCase();
    if (!terms.every(t => hay.includes(t))) continue;
    const score = (c.title.toLowerCase().includes(q) ? 0 : 1) + (c.archived ? 0.5 : 0);
    res.push({c, b, score});
  }
  res.sort((a, z) => a.score - z.score || z.c.updatedAt - a.c.updatedAt);
  Search.results = res.slice(0, 30); Search.idx = 0;
  drawSearch();
}
function hl(text, q) {
  const t = esc(text); if (!q) return t;
  const parts = q.split(/\s+/).filter(Boolean).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return parts.length ? t.replace(new RegExp("(" + parts.map(p => esc(p)).join("|") + ")", "gi"), "<mark>$1</mark>") : t;
}
function drawSearch() {
  const box = $("#searchResults"); const q = $("#searchInput").value.trim();
  box.innerHTML = ""; box.hidden = false;
  if (!Search.results.length) { box.append(h("div", {class: "sr-empty"}, "No cards found for “" + q + "”")); return; }
  Search.results.forEach(({c, b}, i) => {
    const l = findList(b, c.listId);
    const st = dueStatus(c);
    box.append(h("button", {class: "sr-item" + (i === Search.idx ? " on" : ""), onmousedown: e => e.preventDefault(), onclick: () => pickSearch(i)},
      h("div", {class: "sr-title", html: hl(c.title, q)}),
      h("div", {class: "sr-sub"}, b.name + ", " + (l?.title || "no list"),
        c.archived ? h("span", {class: "tag arch"}, "Archived") : null,
        c.complete ? h("span", {class: "tag done"}, "Done") : null,
        c.due ? h("span", {class: "tag" + (st === "overdue" ? " arch" : "")}, "Due " + fmtShort(parseLocal(c.due))) : null)));
  });
}
function pickSearch(i) {
  const r = Search.results[i]; if (!r) return;
  const inp = $("#searchInput"); inp.blur(); $("#searchResults").hidden = true;
  openCard(r.c.id);
}
function initSearch() {
  const inp = $("#searchInput");
  inp.addEventListener("input", runSearch);
  inp.addEventListener("focus", () => { if (inp.value.trim()) runSearch(); });
  inp.addEventListener("blur", () => setTimeout(() => { $("#searchResults").hidden = true; }, 120));
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); Search.idx = Math.min(Search.results.length - 1, Search.idx + 1); drawSearch(); }
    if (e.key === "ArrowUp") { e.preventDefault(); Search.idx = Math.max(0, Search.idx - 1); drawSearch(); }
    if (e.key === "Enter") { e.preventDefault(); pickSearch(Search.idx); }
    if (e.key === "Escape") { inp.value = ""; $("#searchResults").hidden = true; inp.blur(); }
  });
}

/* ================= boot ================= */
function renderAll() { renderChrome(); renderBoard(); if (UI.openCardId) renderModal(); if (UI.drawer) renderDrawer(); }
document.addEventListener("keydown", e => {
  const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable=true]");
  if (e.key === "Escape") {
    if (Slash.el) { closeSlash(); return; }
    if (Pop.el) { Pop.close(); return; }
    if (typing) return;
    if (UI.openCardId) { closeModal(); return; }
    if (UI.drawer) { closeDrawer(); return; }
    if (UI.composer) { UI.composer = null; renderBoard(); }
    return;
  }
  if (typing) return;
  if ((e.key === "/" && !e.ctrlKey && !e.metaKey) || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); $("#searchInput").focus(); }
});
$("#bellBtn").addEventListener("click", () => { if (UI.drawer === "notifications") closeDrawer(); else openDrawer("notifications"); });
addEventListener("resize", () => Pop.place());
document.addEventListener("selectionchange", () => { if (RTE && RTE.updateTableBar) RTE.updateTableBar(); });

S = loadCache() || seedState();
ensureValid();
initSearch();
renderAll();
setInterval(() => { checkReminders(); const a = document.activeElement; if (!UI.openCardId && !Drag.s && !(a && a.closest && a.closest("input, textarea, [contenteditable=true]"))) renderBoard(); }, 60000);
setTimeout(checkReminders, 1500);
initRemote();
</script>
